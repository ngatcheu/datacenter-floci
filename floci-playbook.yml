---
- name: Déployer Floci (émulateur AWS local) avec Docker Compose
  hosts: floci_servers
  become: true
  vars:
    floci_version: "2.4.0"  # https://github.com/hectorvent/floci/releases
    floci_base_dir: /opt/floci
    floci_port: 4566
    floci_ui_port: 4500
    floci_base_url: "http://floci.homelab.local:{{ floci_port }}"
    floci_region: us-east-1
    # memory | persistent | hybrid (écriture disque toutes les 5 s) | wal
    floci_storage_mode: hybrid

  tasks:
    - name: Ajouter le dépôt Docker (RHEL/Rocky)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'

    - name: Installer Docker et le plugin Compose
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Démarrer Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Créer les répertoires Floci
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "{{ floci_base_dir }}"
        - "{{ floci_base_dir }}/data"

    - name: Copier docker-compose.yml
      ansible.builtin.template:
        src: templates/docker-compose.yml.j2
        dest: "{{ floci_base_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Démarrer Floci
      community.docker.docker_compose_v2:
        project_src: "{{ floci_base_dir }}"
        state: present
        pull: missing
        recreate: auto

    - name: Attendre que Floci réponde
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ floci_port }}/_localstack/health"
        status_code: 200
      register: floci_health
      until: floci_health.status == 200
      retries: 30
      delay: 5

    - name: Afficher les informations d'accès
      ansible.builtin.debug:
        msg:
          - "Floci {{ floci_version }} déployé sur {{ inventory_hostname }}"
          - "API AWS  : {{ floci_base_url }}  (ou http://{{ ansible_host }}:{{ floci_port }})"
          - "Console  : http://{{ ansible_host }}:{{ floci_port }}/_floci/ui"
          - "Exemple  : aws --endpoint-url {{ floci_base_url }} s3 ls"
          - "Identifiants factices : AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test"
